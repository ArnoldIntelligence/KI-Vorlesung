project:
  type: website
  output-dir: _site

site-url: https://lu-kas.github.io/Test_KI_Vorlesung/

website:
  title: "Vorlesung KI"
  description: "6-teilige Vorlesungsreihe als Quarto Website"
  navbar:
    left:
      - href: index.qmd
        text: Start
      - text: Einheiten
        menu:
          - text: "01 – Einführung"
            href: notebooks/01-einleitung.ipynb
          - text: "02 – Grundlagen"
            href: notebooks/02-perzeptron.ipynb
          - text: "03 – Methoden"
            href: notebooks/03-einfacheNN.ipynb
          - text: "04 – Anwendungen"
            href: notebooks/04-ueberwachtes_lernen.ipynb
          - text: "05 – Nicht Überwachtes Lernen"
            href: notebooks/05-nicht_ueberwachtes_lernen.ipynb
          - text: "06 – Zeitreihen"
            href: notebooks/06-zeitreihen.ipynb
          - text: "07 – Zusammenfassung"
            href: notebooks/07-zusammenfassung.ipynb
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    pinned: true
    contents:
      - index.qmd
      - text: "01 – Einführung"
        href: notebooks/01-einleitung.ipynb
      - text: "02 – Das Perzeptron"
        href: notebooks/02-perzeptron.ipynb
      - text: "03 – Einfache neuronale Netze"
        href: notebooks/03-einfacheNN.ipynb
      - text: "04 – Überwachtes Lernen"
        href: notebooks/04-ueberwachtes_lernen.ipynb
      - text: "05 – Nicht Überwachtes Lernen"
        href: notebooks/05-nicht_ueberwachtes_lernen.ipynb
      - text: "06 – Zeitreihen"
        href: notebooks/06-zeitreihen.ipynb
      - text: "07 – Zusammenfassung"
        href: notebooks/07-zusammenfassung.ipynb

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/css/styles.scss
    toc: true
    toc-depth: 3
    page-navigation: true
    code-copy: true
    number-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top

execute:
  freeze: true
  echo: true
  warning: false
  message: false

